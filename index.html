<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تواصل معي الآن</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#061a70}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.hero{position:relative;width:min(1536px,100%);aspect-ratio:1536/864;background:url("hero.png") center/cover no-repeat;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008}
.formbox{position:absolute;right:57.5%;top:50.5%;width:31%;transform:translateY(-50%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 15px 40px #00104466}
label{display:block;color:#30416c;font-weight:700;font-size:15px;margin:4px 0 7px}
input{display:block;width:100%;border:2px solid #cfe2ff;border-radius:13px;padding:14px 15px;font-size:16px;margin-bottom:14px;outline:0}
input:focus{border-color:#1877f2}
button{width:100%;border:0;border-radius:13px;padding:15px;background:#1877f2;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.07)}
.note{font-size:11px;color:#68738c;text-align:center;line-height:1.5;margin:10px 0 0}
.success{display:none;margin-top:10px;background:#e8f8ed;color:#1b5b2c;border-radius:10px;padding:10px;text-align:center;font-size:13px}
@media(max-width:900px){
 .page{padding:0}.hero{border-radius:0;min-height:100vh;aspect-ratio:auto;background-position:center top}
 .formbox{right:7%;top:auto;bottom:7%;width:86%;transform:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <form class="formbox" id="leadForm">
      <label for="name">الإسم الكامل</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="contact">رقم الهاتف أو الإيميل</label>
      <input id="contact" name="contact" type="text" autocomplete="email" required>

      <button type="submit">متابعة</button>
      <div class="note">بإرسال النموذج، أنت توافق على استخدام معلومات التواصل للرد عليك.</div>
      <div class="success" id="success">تم إرسال طلبك بنجاح.</div>
    </form>
  </div>
</div>
<script>
document.getElementById('leadForm').addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('success').style.display='block';
});
</script>
</body>
</html>
