<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تواصل معي الآن</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#061a70;font-family:Arial,Tahoma,sans-serif}
body{min-height:100vh}
.page{width:100%;padding:18px}
.hero{position:relative;width:min(1536px,100%);margin:auto}
.hero img{display:block;width:100%;height:auto;border-radius:22px}
.formbox{
  position:absolute;right:5.8%;top:51%;width:31%;
  padding:20px;background:#fff;border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);line-height:normal
}
label{display:block;color:#30416c;font-weight:700;font-size:15px;margin:2px 0 7px}
input{
  display:block;width:100%;height:48px;border:2px solid #cfe2ff;
  border-radius:13px;padding:0 14px;font-size:16px;margin-bottom:13px;outline:none
}
input:focus{border-color:#1877f2}
button{
  display:block;width:100%;height:51px;border:0;border-radius:13px;
  background:#1877f2;color:#fff;font-size:18px;font-weight:800;cursor:pointer
}
.note{text-align:center;color:#68738c;font-size:11px;line-height:1.5;margin-top:9px}
.success{display:none;background:#e8f8ed;color:#1b5b2c;border-radius:10px;padding:9px;text-align:center;font-size:13px;margin-top:9px}

@media (max-width:900px){
  .page{padding:0;background:#071b78}
  .hero{width:100%;display:flex;flex-direction:column}
  .hero img{
    width:100%;height:auto;border-radius:0;
    object-fit:contain
  }
  .formbox{
    position:relative;right:auto;top:auto;width:92%;
    margin:-5px auto 22px;padding:20px;border-radius:20px;
  }
}

@media (max-width:480px){
  .formbox{width:92%;padding:17px}
  label{font-size:14px}
  input{height:47px;font-size:15px}
  button{height:50px;font-size:17px}
}
</style>
</head>
<body>
<div class="page">
  <main class="hero">
    <img src="./image.png" alt="التصميم الترويجي">
    <form class="formbox" id="leadForm">
      <label for="name">الإسم الكامل</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="contact">رقم الهاتف أو الإيميل</label>
      <input id="contact" name="contact" type="text" required>

      <button type="submit">متابعة</button>
      <div class="note">بإرسال النموذج، أنت توافق على استخدام معلومات التواصل للرد عليك.</div>
      <div class="success" id="success">تم إرسال طلبك بنجاح.</div>
    </form>
  </main>
</div>
<script>
document.getElementById("leadForm").addEventListener("submit",function(e){
  e.preventDefault();
  document.getElementById("success").style.display="block";
});
</script>
</body>
</html>
