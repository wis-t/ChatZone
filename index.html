<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Démo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <button class="close" aria-label="Fermer">×</button>

    <div class="language">Français (France) <span>⌄</span></div>

    <div class="facebook-logo" aria-label="Logo de démonstration">f</div>

    <div class="separator"></div>

    <section class="notice">
      <p>Facebook demande et reçoit votre numéro de téléphone par votre réseau mobile.</p>
      <a href="#" onclick="return false">Modifier les paramètres</a>
    </section>

    <form id="demoForm" autocomplete="off">
      <div class="field">
        <label for="identity">Numéro mobile ou e-mail</label>
        <input id="identity" type="text" placeholder="">
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password">
      </div>

      <button class="login" type="submit">Se connecter</button>
    </form>

    <a class="forgot" href="#" onclick="return false">Mot de passe oublié ?</a>

    <button class="create" type="button" id="create">Créer un nouveau compte</button>

    <div class="meta"><span>∞</span> Meta</div>

    <div class="demo-note">
      <span>DEMO</span> — Page de connexion non officielle
    </div>

    <p id="message" class="message"></p>
  </main>

  <script>
    const form = document.getElementById("demoForm");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      password.value = "";
      message.textContent = "Mode démo : aucune donnée n’est envoyée ou enregistrée.";
      message.classList.add("show");
    });

    document.getElementById("create").addEventListener("click", function() {
      message.textContent = "Mode démo : cette action est désactivée.";
      message.classList.add("show");
    });
  </script>
</body>
</html>
